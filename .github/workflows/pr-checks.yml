# Managed from AloysJehwin/Jeffi_Stores (oss/templates); changes here are overwritten by the next export.
#
# Nothing runs when a PR is opened. A maintainer adds the `ok-to-test` label after reading the change; that runs the
# checks below with a read-only token and no secrets. "PR checks" (the last job) is the required status: it
# exists only for `ok-to-test` runs, so another label's skipped run can't satisfy it. New pushes drop the label
# (pr-gate.yml), and the new head has no checks until a maintainer labels it again.
name: PR checks

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}-${{ github.event.label.name }}
  cancel-in-progress: true

jobs:
  checks:
    name: ${{ github.event.label.name == 'ok-to-test' && 'Lint, type check, unit tests' || 'Not requested' }}
    if: github.event.label.name == 'ok-to-test'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - run: echo "pretend everything passed"

  result:
    name: ${{ github.event.label.name == 'ok-to-test' && 'PR checks' || 'PR checks · not requested' }}
    needs: checks
    if: always() && github.event.label.name == 'ok-to-test'
    runs-on: ubuntu-latest
    steps:
      - name: Every check passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "Checks: $RESULT"
          [ "$RESULT" = success ]
